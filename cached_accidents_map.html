<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>사고 발생 지점 지도</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"
    />
    <!-- MarkerCluster CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/MarkerCluster.Default.css"
    />

    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <!-- jQuery (팝업 HTML 생성용) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- PapaParse (CSV 파싱용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <!-- MarkerCluster JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.1.0/leaflet.markercluster.js"></script>

    <script>
      // 1) 지도 초기화
      var map = L.map("map").setView([37.5665, 126.978], 12);
      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
        {
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }
      ).addTo(map);

      // 2) MarkerClusterGroup 생성
      var markerCluster = L.markerClusterGroup().addTo(map);

      // 3) CSV 파싱 & 마커 추가
      Papa.parse("accident.csv", {
        download: true,
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true,
        complete: function (results) {
          results.data.forEach(function (row) {
            var lat = row["위도"],
              lng = row["경도"];
            if (lat && lng) {
              var marker = L.marker([lat, lng]);

              // 부상자 정보 제거: 발생년월일시와 사고유형만 보여줌
              var popupHtml =
                "<b>발생년월일시:</b> " +
                row["발생년월일시"] +
                "<br>" +
                "<b>사고유형:</b> " +
                row["사고유형"];

              marker.bindPopup(popupHtml);
              markerCluster.addLayer(marker);
            }
          });
        },
        error: function (err) {
          console.error("CSV 로드/파싱 오류:", err);
        },
      });
    </script>
  </body>
</html>
